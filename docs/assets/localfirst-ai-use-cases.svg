      <text x="92" y="528" fill="#48647C" font-size="25">Build and repair failures</text>
      <text x="92" y="570" fill="#48647C" font-size="25">Check the user journeys</text>
      <text x="92" y="612" fill="#48647C" font-size="25">Deliver an actual project</text>
      <path d="M92 644h352" stroke="#B8CDDF"/>
    </g>
    <g data-bounds="496 196 408 482">
      <rect x="496" y="196" width="408" height="482" rx="24" fill="#FFFFFF"/>
