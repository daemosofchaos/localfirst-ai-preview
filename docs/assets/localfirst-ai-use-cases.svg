    <text x="64" y="142" fill="#48647C" font-size="26">Give an assistant the brief, the tools and the responsibility to finish.</text>
    <g data-bounds="64 196 408 482">
      <rect x="64" y="196" width="408" height="482" rx="24" fill="#FFFFFF"/>
      <text x="92" y="244" fill="#18354D" font-size="30" font-weight="750">Application</text>
