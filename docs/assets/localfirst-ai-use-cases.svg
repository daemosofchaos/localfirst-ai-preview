<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none" role="img" aria-labelledby="projects-title projects-desc">
  <title id="projects-title">Complete applications, costings and launch packages with LocalFirst-AI</title>
  <desc id="projects-desc">Three project deliverables: an application with source files, tests and setup instructions; a costing workbook with inputs, formulas, scenarios and a PDF; and a launch package with research, a presentation, budget and tasks.</desc>
  <defs><linearGradient id="projects-bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse"><stop stop-color="#F2F8FD"/><stop offset="1" stop-color="#DFEDF8"/></linearGradient></defs>
  <rect width="1400" height="820" rx="32" fill="url(#projects-bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
