      <text x="524" y="528" fill="#48647C" font-size="25">Calculate with formulas</text>
      <text x="524" y="570" fill="#48647C" font-size="25">Compare risk scenarios</text>
      <text x="524" y="612" fill="#48647C" font-size="25">Reconcile every total</text>
