<text x="800" y="320" fill="#2463A6" font-size="22" font-weight="700">NOTES + SOURCES</text><text x="800" y="363" fill="#18354D" font-size="24">Decisions you keep</text><text x="800" y="399" fill="#48647C" font-size="21">Evidence, not guesswork</text>
<text x="1076" y="320" fill="#6554A4" font-size="22" font-weight="700">TASKS + SKILLS</text><text x="1076" y="363" fill="#18354D" font-size="24">A way forward</text><text x="1076" y="399" fill="#48647C" font-size="21">Reusable methods</text>
